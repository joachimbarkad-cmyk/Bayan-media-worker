services:
  video:
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BAYAN_TOKEN: ${BAYAN_TOKEN:?Set BAYAN_TOKEN}
      BAYAN_TRANSCRIPTION: local
      BAYAN_WHISPER_MODEL: ${BAYAN_WHISPER_MODEL:-small}
      BAYAN_ALLOW_PAID_AI: "0"
    volumes:
      - bayan-data:/data
      - bayan-models:/models
volumes:
  bayan-data:
  bayan-models:
